# ---------------------------------------------------------------------------
# Cloud Build: build the image, push it to Artifact Registry, deploy to Cloud Run.
#
# Run it with (see DEPLOY.md for the one-time setup):
#
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=asia-southeast1,\
# _FIREBASE_API_KEY=...,_FIREBASE_AUTH_DOMAIN=...,_FIREBASE_APP_ID=...
#
# The NEXT_PUBLIC_* values are Firebase web config. They are public by design
# (access is controlled by the Firestore rules and by server-side authorisation),
# which is why they are substitutions rather than secrets.
# ---------------------------------------------------------------------------

substitutions:
  _REGION: asia-southeast1
  _SERVICE: smartwatch-ceo-challenge
  _REPOSITORY: apps
  _FIREBASE_API_KEY: ''
  _FIREBASE_AUTH_DOMAIN: ''
  _FIREBASE_APP_ID: ''
  # Leave empty in production. Set it once, to the email of the first person who
  # should be an admin, so there is someone who can promote the instructors.
  _BOOTSTRAP_ADMIN_EMAIL: ''

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:latest'

steps:
  # Fail the build before deploying if the simulation is broken. The engine's
  # correctness is the product, so a red test must never reach students.
  - id: test
    name: node:22-alpine
    entrypoint: sh
    args:
      - -c
      - |
        npm ci
        npx tsc --noEmit
        npm test

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_PROJECT_ID=${PROJECT_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:latest'
      - '.'

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}'

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      # The service account needs roles/datastore.user; Firebase Admin picks it
      # up through Application Default Credentials, so no key file exists.
      - '--service-account=${_SERVICE}@${PROJECT_ID}.iam.gserviceaccount.com'
      - '--set-env-vars=GOOGLE_CLOUD_PROJECT=${PROJECT_ID},BOOTSTRAP_ADMIN_EMAIL=${_BOOTSTRAP_ADMIN_EMAIL}'
      - '--cpu=1'
      - '--memory=512Mi'
      # Scale to zero between classes; a small max keeps a runaway cost impossible.
      - '--min-instances=0'
      - '--max-instances=10'
      - '--concurrency=80'
      - '--timeout=60'

timeout: 1800s
