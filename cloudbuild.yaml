# ---------------------------------------------------------------------------
# Cloud Build: test, build, push to Artifact Registry, deploy to Cloud Run.
#
# Normal use is `./scripts/deploy.sh`, which reads .deploy.env and fills these
# substitutions in for you. To call it directly, see DEPLOY.md.
#
# Speed. Cloud Build workers start clean, so nothing is cached unless we say so.
# Two things make a repeat deploy roughly twice as fast as a first one:
#
#   1. `deps` is built and pushed as its own image. With --cache-from, a rebuild
#      whose package-lock.json has not changed reuses that layer and skips
#      `npm ci` entirely (37s saved).
#   2. The test stage and the application build both derive from `deps` and run
#      in PARALLEL, so the 6s of typecheck-and-test hides inside the 55s build
#      instead of being added to it.
#
# The NEXT_PUBLIC_* values are Firebase web config. They are public by design
# (access is controlled by the Firestore rules and by server-side
# authorisation), which is why they are substitutions rather than secrets.
# ---------------------------------------------------------------------------

substitutions:
  _REGION: asia-southeast1
  _SERVICE: smartwatch-ceo-challenge
  _REPOSITORY: apps
  _FIREBASE_API_KEY: ''
  _FIREBASE_AUTH_DOMAIN: ''
  _FIREBASE_APP_ID: ''
  # Leave empty in production. Set it once, to the email of the first person who
  # should be an admin, so there is someone who can promote the instructors.
  _BOOTSTRAP_ADMIN_EMAIL: ''

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

# There is deliberately NO `images:` block. Cloud Build pushes the images listed
# there only AFTER every step has finished — which is after the deploy step, so
# `gcloud run deploy` would reference a tag that does not exist in Artifact
# Registry yet and fail. The pushes are explicit steps below instead, ordered
# before the deploy. Do not "simplify" this back into `images:`.

steps:
  # Pull the previous images so docker can reuse unchanged layers. A cache miss
  # on the very first build is expected and must not fail the run.
  - id: warm-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker pull '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}-deps:latest' || echo 'no deps cache yet'
        docker pull '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:latest' || echo 'no app cache yet'

  # The dependency layer, cached across builds by package-lock.json.
  - id: deps
    name: gcr.io/cloud-builders/docker
    waitFor: ['warm-cache']
    args:
      - build
      - '--target=deps'
      - '--cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}-deps:latest'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}-deps:latest'
      - '.'

  # Push the dependency cache image so the NEXT build can --cache-from it.
  # Parallel with the test and the build: nothing downstream waits on it.
  - id: push-deps
    name: gcr.io/cloud-builders/docker
    waitFor: ['deps']
    args:
      - push
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}-deps:latest'

  # Typecheck and the full test suite. Runs in parallel with the build below;
  # if it fails, the deploy step never runs.
  - id: test
    name: gcr.io/cloud-builders/docker
    waitFor: ['deps']
    args:
      - build
      - '--target=tester'
      - '--cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}-deps:latest'
      - '-t'
      - 'smartwatch-tester:${SHORT_SHA}'
      - '.'

  - id: build
    name: gcr.io/cloud-builders/docker
    waitFor: ['deps']
    args:
      - build
      - '--cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}-deps:latest'
      - '--cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:latest'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_PROJECT_ID=${PROJECT_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:latest'
      - '.'

  # The image must be in Artifact Registry BEFORE the deploy step reads it.
  - id: push-app
    name: gcr.io/cloud-builders/docker
    waitFor: ['build']
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        docker push '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${SHORT_SHA}'
        docker push '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:latest'

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    # Both the tests and the image must be done before anything ships.
    waitFor: ['test', 'push-app']
    args:
      - run
      - deploy
      - '${_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      # The service account needs roles/datastore.user; Firebase Admin picks it
      # up through Application Default Credentials, so no key file exists.
      - '--service-account=${_SERVICE}@${PROJECT_ID}.iam.gserviceaccount.com'
      - '--set-env-vars=GOOGLE_CLOUD_PROJECT=${PROJECT_ID},BOOTSTRAP_ADMIN_EMAIL=${_BOOTSTRAP_ADMIN_EMAIL}'
      - '--cpu=1'
      - '--memory=512Mi'
      # Scale to zero between classes; a small max keeps a runaway cost impossible.
      - '--min-instances=0'
      - '--max-instances=10'
      - '--concurrency=80'
      - '--timeout=60'

timeout: 1800s
